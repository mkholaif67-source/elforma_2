# ElForma deployment. Designed so that nobody has to configure anything by hand:
# the only value a human must supply is the mail transport key (see below), and
# the app degrades gracefully until it is provided.
services:
  - type: web
    name: elforma
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: EF_ENV
        value: production
      - key: EF_TRUST_PROXY
        value: "1"
      # [FIX-DEPLOY-SQLITE] node:sqlite لسه experimental على Node 22،
      # فلو أمر التشغيل اتغير من اللوحة يفضل الفلاج موجود.
      - key: NODE_OPTIONS
        value: --experimental-sqlite
      # [ADMIN] إيميل الأدمن اللي ليه أكسس لوحة التحكم.
      - key: EF_ADMIN_EMAILS
        value: mokholaif7@gmail.com
      # The database, the backups and the session secret all live on the disk
      # mounted below, so they survive every deploy and restart.
      - key: EF_DATA_DIR
        value: /var/data/elforma
      # [FIX WalConflict] الاتصال بـTurso مباشر (مفيش نسخة محلية = مفيش WAL محلي
      # = مفيش WalConflict). حوّلها لـ replica بس لو عندك قرص دائم فعلًا.
      - key: EF_DATABASE_ENGINE
        value: turso
      - key: EF_REQUIRE_DURABLE_DB
        value: "1"
      - key: EF_TURSO_MODE
        value: remote
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: EF_SECRET
        sync: false
      # EF_SECRET is deliberately NOT declared here.
      #
      # `generateValue: true` would mint a NEW secret on each deploy, and since
      # sessions are signed with it, every user would be silently logged out --
      # which is exactly the "my login stopped working" bug. With no value set,
      # the server generates a secret once and persists it to EF_DATA_DIR, so
      # sessions stay valid across deploys with zero manual setup.
      #
      # Optional: the outgoing mail transport for verification and password
      # reset emails. Until these are set, emails are written to the outbox on
      # disk instead of being delivered; nothing else breaks.
      - key: EF_MAIL_API_URL
        sync: false
      - key: EF_MAIL_API_KEY
        sync: false
      - key: EF_MAIL_FROM
        sync: false
      # Optional one-time owner activation from the browser. Set a long random
      # value in Render, use it once on /login.html, then delete the variable.
      - key: EF_ADMIN_SETUP_TOKEN
        sync: false
    disk:
      name: elforma-data
      mountPath: /var/data/elforma
      sizeGB: 1

  # NOTE: there is deliberately no cron service here.
  # A Render disk can only be attached to ONE service, so a separate
  # backup cron would either fail to deploy or mount its own EMPTY
  # disk and cheerfully back up nothing. The nightly backup therefore
  # runs inside the web service itself (lib/backup-scheduler.js),
  # which is the only process that can actually see the database.
