<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ElForma — تطبيق موبايل</title>
  <link rel="manifest" href="/site.webmanifest" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #14324a, #0b1620 60%); color: #eaf2f8;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 440px; text-align: center;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px; padding: 40px 28px; backdrop-filter: blur(6px);
    }
    .logo { font-size: 40px; font-weight: 800; letter-spacing: .5px; margin: 0 0 6px; }
    .logo span { color: #43c6ac; }
    .tag { margin: 0 0 26px; color: #9fb4c2; font-size: 15px; line-height: 1.7; }
    .btn {
      display: inline-block; width: 100%; padding: 14px 18px; margin-top: 10px;
      border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 15px;
    }
    .btn.primary { background: #43c6ac; color: #06231d; }
    .btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,.16); color: #eaf2f8; }
    .foot { margin-top: 22px; font-size: 12px; color: #6f8595; }
    .foot a { color: #8fa6b5; }
  </style>
<link rel="stylesheet" href="/assets/css/product-pages.css"></head>
<body>
  <main class="card">
    <h1 class="logo">El<span>Forma</span></h1>
    <p class="tag">ده تطبيق موبايل للتغذية والتمرين.<br />حمل التطبيق على الموبايل وسجل دخولك من جواه.</p>
    <a class="btn ghost" href="/login.html?next=%2Fadmin.html">دخول لوحة الأدمن</a>
    <p class="foot">
      <a href="privacy.html">الخصوصية</a> ·
      <a href="terms.html">الشروط</a> ·
      <a href="disclaimer.html">إخلاء المسؤولية</a>
    </p>
  </main>
</body>
</html>
