<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استعادة كلمة المرور — الفورمة</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Noto+Kufi+Arabic:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/landing.css?v=100">
<link rel="stylesheet" href="assets/css/pages.css?v=100">
<link rel="stylesheet" href="assets/css/secondary.css">
<link rel="stylesheet" href="/assets/css/product-pages.css"></head>
<body class="sec-page">
<header class="nav" style="background:rgba(6,10,18,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.07);position:sticky;top:0;z-index:100;">
  <div class="container nav-in" style="display:flex;align-items:center;justify-content:space-between;">
    <a class="logo" href="index.html" style="display:flex;align-items:center;gap:9px;text-decoration:none;">
      <img src="assets/logo-mark.png" alt="الفورمة" style="height:32px;width:auto;">
    </a>
    <div style="display:flex;align-items:center;gap:4px;">
      <a href="index.html" style="display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;font-size:13.5px;font-weight:600;color:#9db3ab;text-decoration:none;transition:color .2s,background .2s;" onmouseover="this.style.color='#fff';this.style.background='rgba(255,255,255,.07)'" onmouseout="this.style.color='#9db3ab';this.style.background=''">الصفحة الرئيسية</a>
      <a href="login.html" style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13.5px;font-weight:700;color:#2ee6a6;text-decoration:none;background:rgba(19,194,150,.12);border:1px solid rgba(19,194,150,.25);transition:background .2s;" onmouseover="this.style.background='rgba(19,194,150,.2)'" onmouseout="this.style.background='rgba(19,194,150,.12)'">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        تسجيل الدخول
      </a>
    </div>
  </div>
</header>

<div class="status-wrap">
  <div class="status-card">
    <div class="status-glow"></div>
    <div class="status-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1"/></svg>
    </div>
    <h1 class="status-title" id="title">استعادة كلمة المرور</h1>
    <p class="status-sub" id="sub">هنبعتلك رابط استعادة على بريدك</p>
    <div class="msg" id="msg"></div>

    <form id="forgotForm">
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="email" required autocomplete="email" placeholder="you@example.com"></div>
      <button type="submit" class="status-btn" id="fbtn">أرسل رابط الاستعادة</button>
    </form>

    <form id="resetForm" style="display:none">
      <div class="field"><label>كلمة المرور الجديدة (10 أحرف على الأقل، حروف + أرقام)</label><input type="password" id="password" required autocomplete="new-password" placeholder="••••••••"></div>
      <div class="field"><label>تأكيد كلمة المرور</label><input type="password" id="password2" required autocomplete="new-password" placeholder="••••••••"></div>
      <button type="submit" class="status-btn" id="rbtn">تعيين كلمة المرور</button>
    </form>

    <p class="status-alt"><a href="login.html">الرجوع لتسجيل الدخول</a></p>
  </div>
</div>
<script>
(function(){
  var params=new URLSearchParams(location.search); var token=params.get('token')||'';
  var msg=document.getElementById('msg'), sub=document.getElementById('sub'), title=document.getElementById('title');
  function show(t,cls){msg.textContent=t;msg.className='msg '+cls;}
  async function post(url,payload){ try{ var r=await fetch(url,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); var j={}; try{j=await r.json();}catch(e){} return {ok:r.ok,data:j}; }catch(e){ return {ok:false,data:{error:'تعذر الاتصال بالخادم'}}; } }

  if(token){
    title.textContent='كلمة مرور جديدة'; sub.textContent='اختر كلمة مرور جديدة لحسابك';
    document.getElementById('forgotForm').style.display='none';
    document.getElementById('resetForm').style.display='';
    document.getElementById('resetForm').addEventListener('submit',async function(e){
      e.preventDefault();
      var p=document.getElementById('password').value, p2=document.getElementById('password2').value;
      /* [FIX H1] متطابق مع auth.passwordProblem في السيرفر. */
      if(p.length<10){ show('كلمة المرور لازم تكون 10 أحرف على الأقل','err'); return; }
      if(!/[A-Za-z]/.test(p)||!/[0-9]/.test(p)){ show('كلمة المرور لازم تحتوي على حروف وأرقام','err'); return; }
      if(p!==p2){ show('كلمتا المرور غير متطابقتين','err'); return; }
      var btn=document.getElementById('rbtn'); btn.disabled=true; btn.textContent='جاري الحفظ...';
      var r=await post('/api/auth/reset',{token:token,password:p});
      if(r.ok){ show('تم تغيير كلمة المرور. جاري تحويلك لتسجيل الدخول...','ok'); setTimeout(function(){location.href='login.html';},1500); }
      else{ show((r.data&&r.data.error==='invalid_or_expired')?'الرابط منتهي أو تم استخدامه. اطلب رابطا جديدا.':((r.data&&r.data.error)||'حصل خطأ'),'err'); btn.disabled=false; btn.textContent='تعيين كلمة المرور'; }
    });
  } else {
    document.getElementById('forgotForm').addEventListener('submit',async function(e){
      e.preventDefault();
      var btn=document.getElementById('fbtn'); btn.disabled=true; btn.textContent='جاري الإرسال...';
      var r=await post('/api/auth/forgot',{email:document.getElementById('email').value.trim()});
      show('لو البريد مسجل عندنا، هيوصلك رابط الاستعادة خلال دقايق. اتأكد من صندوق الوارد والSpam.','ok');
      btn.disabled=false; btn.textContent='أرسل رابط الاستعادة';
      if(r.data&&r.data.dev_link){ show('رابط الاستعادة (وضع التطوير): '+r.data.dev_link,'ok'); }
    });
  }
})();
</script>
</body>
</html>
