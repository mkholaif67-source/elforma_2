<!-- Share plan + notifications/service worker.
     api/share.js and public/sw.js + public/notif.js were shipped with no UI
     and no registration, so none of it could ever run. -->
<style>
.ef-share-fab{position:fixed;z-index:99990;bottom:20px;left:82px;height:52px;padding:0 18px;border-radius:26px;display:flex;align-items:center;gap:8px;background:rgba(8,26,22,.92);color:#00D4AA;border:1px solid rgba(0,212,170,.42);box-shadow:0 10px 26px -8px rgba(0,0,0,.6);cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;transition:transform .18s ease,background .18s ease}
.ef-share-fab:hover{transform:translateY(-3px);background:rgba(0,212,170,.16)}
.ef-share-fab:disabled{opacity:.55;cursor:not-allowed;transform:none}
.ef-share-fab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:600px){.ef-share-fab{bottom:86px;left:70px;height:46px;padding:0 14px;font-size:13px}}
</style>
<script>
window.addEventListener('DOMContentLoaded', function () {
  // ---- Share button ----
  try {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ef-share-fab';
    btn.setAttribute('aria-label', 'شارك خطتي');
    btn.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line></svg><span>شارك خطتي</span>';
    var say = function (m, k) { if (window.EFToast && EFToast.show) EFToast.show(m, k || 'ok'); else alert(m); };
    btn.addEventListener('click', function () {
      btn.disabled = true;
      fetch('/api/share/plan', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ planType: 'both' })
      }).then(function (r) {
        return r.json().then(function (j) { return { status: r.status, body: j }; });
      }).then(function (out) {
        btn.disabled = false;
        if (out.status === 401) return say('لازم تسجّل دخول الأول', 'err');
        if (out.status !== 200 || !out.body || !out.body.url) {
          return say((out.body && out.body.error) || 'تعذّر إنشاء رابط المشاركة', 'err');
        }
        var url = out.body.url;
        var copied = function () { say('الرابط اتنسخ ✔ صالح ٤٨ ساعة', 'ok'); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(copied).catch(function () { window.prompt('انسخ الرابط:', url); });
        } else {
          window.prompt('انسخ الرابط:', url);
        }
      }).catch(function () {
        btn.disabled = false;
        say('تعذّر إنشاء رابط المشاركة، اتأكد من الاتصال', 'err');
      });
    });
    document.body.appendChild(btn);
  } catch (e) {}
});
</script>
<script src="/notif.js" defer></script>
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function (err) {
      console.warn('[sw] registration failed:', err && err.message);
    });
  });
})();
</script>
