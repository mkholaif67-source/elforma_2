.orb2{width:600px;height:600px;background:radial-gradient(circle,rgba(255,107,53,.42),transparent 70%);bottom:-220px;left:-160px;animation-delay:-4.5s}

@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-36px) scale(1.08)}}

.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(3,5,9,.65) 100%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.035;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px}

.motes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.motes span{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;opacity:0;animation:rise 9s ease-in infinite}
.motes span:nth-child(odd){background:#7df0d8;box-shadow:0 0 8px 2px rgba(0,212,170,.7)}
.motes span:nth-child(even){background:#ffc39a;box-shadow:0 0 8px 2px rgba(255,107,53,.6)}
.motes span:nth-child(1){left:12%;animation-delay:.2s}
.motes span:nth-child(2){left:24%;animation-delay:2.4s}
.motes span:nth-child(3){left:38%;animation-delay:1.1s}
.motes span:nth-child(4){left:52%;animation-delay:3.6s}
.motes span:nth-child(5){left:66%;animation-delay:.8s}
.motes span:nth-child(6){left:78%;animation-delay:2.9s}
.motes span:nth-child(7){left:88%;animation-delay:1.7s}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.7)}12%{opacity:.9}85%{opacity:.3}100%{opacity:0;transform:translateY(-92vh) scale(1.3)}}

/* ===== لمعة سينمائية تمر مرة واحدة ===== */
.flare{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);transform:translateX(-100%);animation:flareSweep 2.4s ease 1.1s 1}
@keyframes flareSweep{to{transform:translateX(100%)}}

/* ===== شاشة الترحيب ===== */
.scene{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

.hero{position:relative;width:230px;height:230px;margin-bottom:6px;animation:heroFloat 7s ease-in-out infinite}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero .halo,.hero .pulse,.hero .ring-rot,.hero .orbit,.hero .w-logo{position:absolute;inset:0;margin:auto}

.halo{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,170,.55),rgba(34,184,207,.15) 55%,transparent 70%);filter:blur(22px);animation:halo 3.6s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(.86);opacity:.55}50%{transform:scale(1.18);opacity:1}}

.pulse{width:118px;height:118px;border-radius:36px;border:2px solid rgba(0,212,170,.55);opacity:0;animation:pulseR 3s ease-out infinite}
.pulse.p2{border-color:rgba(255,107,53,.5);animation-delay:1s}
.pulse.p3{border-color:rgba(34,184,207,.45);animation-delay:2s}
@keyframes pulseR{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.1);opacity:0}}

.ring-rot{width:168px;height:168px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,rgba(0,212,170,.9) 60deg,rgba(255,107,53,.55) 130deg,transparent 190deg,transparent 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));opacity:0;animation:spin2 6s linear infinite,fade .8s ease .6s forwards}
@keyframes spin2{to{transform:rotate(360deg)}}

.orbit{opacity:0;animation:spin2 8s linear infinite,fade .8s ease .9s forwards}
.orbit.o1{width:160px;height:160px}
.orbit.o2{width:188px;height:188px;animation-duration:12s}
.orbit .spark{position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#7df0d8;box-shadow:0 0 16px 4px rgba(0,212,170,.9)}
.orbit .spark.s2{background:#ffd0b8;box-shadow:0 0 16px 4px rgba(255,140,80,.85)}

.w-logo{width:116px;height:116px;border-radius:32px;background:linear-gradient(135deg,#0d1c17,#0a1512);display:flex;align-items:center;justify-content:center;box-shadow:0 26px 70px rgba(0,212,170,.45),0 0 0 1px rgba(255,255,255,.08) inset;transform:scale(.4) rotate3d(1,1,0,45deg);opacity:0;animation:popIn 1.05s cubic-bezier(.2,.9,.2,1) .15s forwards;z-index:2}
.w-logo img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35));animation:logoBob 3.4s ease-in-out infinite .6s}
@keyframes logoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes popIn{to{transform:scale(1) rotate3d(0,0,0,0);opacity:1}}

/* ===== عنوان بتأثير دخول متتالي للكلمات ===== */
.w-title{margin-top:28px;font-size:clamp(26px,5.2vw,40px);font-weight:900;letter-spacing:-.5px;display:flex;gap:.3em;flex-wrap:wrap;justify-content:center;max-width:600px}
.w-title span{opacity:0;filter:blur(6px);transform:translateY(16px) scale(.94);display:inline-block;animation:wordIn .7s cubic-bezier(.2,.9,.2,1) forwards}
.w-title span.brand{background:linear-gradient(120deg,#ffffff 10%,#9fece0 45%,#ffd9c2 70%,#ffffff 95%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:wordIn .7s cubic-bezier(.2,.9,.2,1) forwards, shimmer 5s linear infinite 2.2s}
.w-title span:nth-child(1){animation-delay:.85s}
.w-title span:nth-child(2){animation-delay:.96s}
.w-title span:nth-child(3){animation-delay:1.07s}
.w-title span:nth-child(4){animation-delay:1.18s}
.w-title span:nth-child(5){animation-delay:1.29s}
.w-title span:nth-child(6){animation-delay:1.4s}
@keyframes wordIn{to{opacity:1;filter:blur(0);transform:translateY(0) scale(1)}}
@keyframes shimmer{to{background-position:200% center}}

.w-accent{width:0;height:3px;margin:20px auto 0;border-radius:2px;background:linear-gradient(90deg,transparent,var(--nu),var(--wo),transparent);box-shadow:0 0 16px rgba(0,212,170,.6);animation:accent 1s cubic-bezier(.2,.9,.2,1) 1.6s forwards}
@keyframes accent{to{width:220px}}

.w-sub{margin-top:18px;font-size:18px;color:var(--mut);max-width:560px;text-align:center;line-height:1.9;opacity:0;transform:translateY(18px);animation:rise .9s ease 1.85s forwards;padding:0 24px}
.w-line{margin-top:26px;font-size:15px;color:#5d7f7a;opacity:0;animation:fade 1s ease 2.6s forwards;letter-spacing:1px;display:flex;align-items:center;gap:8px;justify-content:center}
.w-line .dot{width:6px;height:6px;border-radius:50%;background:var(--nu);animation:blink 1.3s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes fade{to{opacity:1}}

.bar-track{width:230px;height:4px;border-radius:999px;background:rgba(255,255,255,.08);overflow:visible;position:relative;margin:34px auto 26px;opacity:0;animation:fade .8s ease 3s forwards}
.w-bar{position:absolute;inset:0 auto 0 0;height:100%;width:0;background:linear-gradient(90deg,var(--nu),var(--wo));box-shadow:0 0 14px rgba(0,212,170,.7);border-radius:999px}
.w-bar.run{animation:grow var(--dur,15s) linear forwards}
.w-bar::after{content:'';position:absolute;top:50%;right:0;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 10px 4px rgba(255,255,255,.8);transform:translateY(-50%)}
@keyframes grow{to{width:100%}}

.skip{margin-top:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#cfeee7;padding:12px 26px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;opacity:0;backdrop-filter:blur(6px);transition:background .25s,border-color .25s,transform .2s;animation:fade .8s ease 3.3s forwards;display:inline-flex;align-items:center;gap:8px}
.skip:hover{background:rgba(0,212,170,.14);border-color:rgba(0,212,170,.4);transform:translateY(-2px)}
.skip svg{width:14px;height:14px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:480px){.w-title{font-size:34px}.hero{width:180px;height:180px;transform:scale(.9)}}

/* ===== إدارة المشاهد (ترحيب - اختيار) ===== */
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .7s ease}
.scene.on{opacity:1;pointer-events:auto}

/* ===== شاشة اختيار القسم ===== */
.p-head{font-size:42px;font-weight:900;letter-spacing:-.5px;text-align:center;margin-bottom:46px;opacity:0;transform:translateY(20px);background:linear-gradient(120deg,#fff 20%,#a9e7db 60%,#ffd0b8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-size:200% auto}
.p-head.in{animation:rise .8s ease forwards, shimmer 6s linear infinite 1s}
@keyframes shimmer{to{background-position:200% center}}
.p-sub{color:var(--mut);text-align:center;font-size:16px;margin-bottom:44px;opacity:0;transform:translateY(16px)}
.p-sub.in{animation:rise .8s ease .15s forwards}
.cards{display:flex;flex-direction:row-reverse;gap:30px;flex-wrap:wrap;justify-content:center;padding:0 22px}

.card{position:relative;width:300px;background:linear-gradient(165deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:26px;padding:38px 26px 32px;cursor:pointer;text-align:center;opacity:0;transform:translateY(34px) scale(.97);transition:transform .35s cubic-bezier(.2,.9,.2,1),border-color .35s,box-shadow .35s;overflow:hidden}
.card.in{animation:cardIn .7s cubic-bezier(.2,.9,.2,1) forwards}
.card.d1.in{animation-delay:.25s}
.card.d2.in{animation-delay:.4s}
@keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1)}}
/* توهج حول الكارت عند المرور */
.card::before{content:'';position:absolute;inset:-1px;border-radius:26px;padding:1px;background:linear-gradient(160deg,transparent,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .35s}
.card.wo:hover{transform:translateY(-10px) scale(1.02);border-color:rgba(255,107,53,.5);box-shadow:0 30px 70px rgba(255,107,53,.18)}
.card.nu:hover{transform:translateY(-10px) scale(1.02);border-color:rgba(0,212,170,.5);box-shadow:0 30px 70px rgba(0,212,170,.18)}

/* الحلقة الدائرية */
.ring{position:relative;width:132px;height:132px;margin:0 auto 22px}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:rgba(255,255,255,.07);stroke-width:8}
.ring .prog{fill:none;stroke-width:8;stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.card.in .ring .prog{stroke-dashoffset:58}
.card.wo .prog{stroke:url(#gWo)}
.card.nu .prog{stroke:url(#gNu)}
.ring .emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;animation:bob 3.4s ease-in-out infinite}
.card.nu .ring .emoji{animation-delay:-1.7s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.card:hover .ring svg{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(270deg)}}

.card h3{font-size:25px;font-weight:800;margin-bottom:6px}
.card .st{color:var(--mut);font-size:14px;font-weight:600;margin-bottom:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-weight:800;font-size:15px;padding:13px 30px;border-radius:999px;border:none;cursor:pointer;color:#08121a;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.card.wo .btn{background:linear-gradient(135deg,var(--wo),var(--wo2));box-shadow:0 10px 26px rgba(255,107,53,.35)}
.card.nu .btn{background:linear-gradient(135deg,var(--nu),var(--nu2));box-shadow:0 10px 26px rgba(0,212,170,.35)}
.card:hover .btn{transform:translateY(-2px) scale(1.04)}
.card.wo:hover .btn{box-shadow:0 16px 34px rgba(255,107,53,.5)}
.card.nu:hover .btn{box-shadow:0 16px 34px rgba(0,212,170,.5)}
.btn .ar{transition:transform .25s}
.card:hover .btn .ar{transform:translateX(-5px)}
/* لمعة زجاجية تمر على الزر */
.btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg)}
.card:hover .btn::after{animation:sheen .8s ease}
@keyframes sheen{from{left:-60%}to{left:120%}}

.badge{position:absolute;top:16px;left:16px;font-size:11.5px;font-weight:800;padding:5px 12px;border-radius:999px;display:none;align-items:center;gap:5px}
.card.wo .badge{background:rgba(255,107,53,.16);color:#ffb491}
.card.nu .badge{background:rgba(0,212,170,.16);color:#7df0d8}
.card.done .badge{display:inline-flex}

.foot{margin-top:38px;color:#56708a;font-size:13px;text-align:center;max-width:640px;padding:0 24px;opacity:0}
.foot.in{animation:fade 1s ease .7s forwards}

@media(max-width:660px){.cards{flex-direction:column;align-items:center}.p-head{font-size:32px}.card{width:min(340px,86vw)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.scene{opacity:1}.card,.p-head,.p-sub,.foot{opacity:1;transform:none}.ring .prog{stroke-dashoffset:58}}

  if(!firstTime){sub.textContent='أهلا برجوعك — دائما جاهزين.';line.innerHTML='<span class="dot"></span>لحظة واحدة…';}

  function revealPath(){
    path.classList.add('on');
    ['pHead','cardWorkout','cardDiet'].forEach(function(id){document.getElementById(id).classList.add('in');});
  }
  function toPath(){
    welcome.classList.remove('on');
    setTimeout(revealPath,380);
    localStorage.setItem(SEEN_KEY,'1');
  }

  // حالة الأقسام + التوجيه الذكي (يعتمد على حساب المستخدم لا على المتصفح فقط)
  var P=window.EFProfile;
  var cW=document.getElementById('cardWorkout'), cD=document.getElementById('cardDiet');

  function wDoneNow(){try{return !!(P&&P.isWorkoutDone());}catch(e){return false;}}
  function dDoneNow(){try{return !!(P&&P.isDietDone());}catch(e){return false;}}

  // تحديث الكروت وروابطها حسب حالة كل قسم
  function wireCards(){
    var w=wDoneNow(),d=dDoneNow();
    if(w){cW.classList.add('done');document.getElementById('goWorkout').firstChild.textContent='افتح الداشبورد ';}
    if(d){cD.classList.add('done');document.getElementById('goDiet').firstChild.textContent='افتح الداشبورد ';}
    cW.onclick=function(){try{localStorage.setItem('EF_LAST_SECTION','workout');}catch(e){}location.href=w?'workout/dashboard.html':'workout/index.html';};
    cD.onclick=function(){try{localStorage.setItem('EF_LAST_SECTION','diet');}catch(e){}location.href=d?'diet/dashboard.html':'diet/index.html';};
  }

  // شاشة الترحيب الكاملة (للمستخدم الجديد بدون خطة)
  function startWelcome(){
    wireCards();
    if(forcePath){welcome.style.display='none';revealPath();return;}
    welcome.classList.add('on');
    bar.style.setProperty('--dur',dur+'ms');
    bar.classList.add('run');
    var timer=setTimeout(toPath,dur);
    document.getElementById('skipBtn').onclick=function(){clearTimeout(timer);toPath();};
  }

  // اختيار سريع (الاتنين جاهزين) بدون انتظار الأنيميشن
  function goChooser(){ wireCards(); welcome.style.display='none'; revealPath(); }

  // هيدرات حالة الحساب من السيرفر قبل قرار التوجيه
  // يمنع ظهور المعالج لمستخدم عنده خطة على جهاز/متصفح جديد
  function hydrateProfile(){
    return fetch('/api/state',{credentials:'include'})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(j){
        if(j&&j.state&&j.state.EF_UNIFIED_PROFILE){
          try{localStorage.setItem('EF_UNIFIED_PROFILE',j.state.EF_UNIFIED_PROFILE);}catch(e){}
        }
      })
      .catch(function(){});
  }

  // القرار النهائي للتوجيه
  if(forcePath){ startWelcome(); }   // ‎#choose‎ = افتح شاشة الاختيار دائما
  else {
    hydrateProfile().then(function(){
      var w=wDoneNow(),d=dDoneNow();
      if(w&&!d){ location.replace('workout/dashboard.html'); return; } // قسم واحد جاهز - الداشبورد فورا
      if(d&&!w){ location.replace('diet/dashboard.html'); return; }
      if(w&&d){ var last=null;try{last=localStorage.getItem('EF_LAST_SECTION');}catch(e){} if(last==='workout'){ location.replace('workout/dashboard.html'); return; } if(last==='diet'){ location.replace('diet/dashboard.html'); return; } goChooser(); return; }   // الاتنين جاهزين - اختيار سريع
      startWelcome();                      // لسه مفيش خطة - المعالج التعريفي
    });
  }
})();
</script>
