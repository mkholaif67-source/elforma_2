<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12203A"/>
      <stop offset="1" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="cring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FF8F5E"/>
    </linearGradient>
    <linearGradient id="cskin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFC29C"/>
      <stop offset="1" stop-color="#DDA57A"/>
    </linearGradient>
    <clipPath id="cclip"><circle cx="80" cy="80" r="72"/></clipPath>
  </defs>
  <circle cx="80" cy="80" r="78" fill="url(#cring)"/>
  <circle cx="80" cy="80" r="72" fill="url(#cbg)"/>
  <g clip-path="url(#cclip)">
    <!-- athletic shoulders + FORMA polo -->
    <path d="M14 168 C18 124 44 108 80 108 C116 108 142 124 146 168 Z" fill="#20120A"/>
    <path d="M26 168 C32 134 52 120 80 120 C108 120 128 134 134 168 Z" fill="#FF6B35"/>
    <!-- collar -->
    <path d="M68 112 L80 126 L92 112 L86 110 L80 118 L74 110 Z" fill="#20120A"/>
    <!-- whistle -->
    <path d="M80 124 L100 140" stroke="#C9CED6" stroke-width="2"/>
    <circle cx="103" cy="142" r="6" fill="#C9CED6"/>
    <!-- neck -->
    <rect x="69" y="90" width="22" height="26" rx="10" fill="#CE9A70"/>
    <!-- head -->
    <circle cx="80" cy="64" r="30" fill="url(#cskin)"/>
    <!-- short athletic hair -->
    <path d="M50 58 C50 38 66 30 80 30 C94 30 110 38 110 58 C104 50 96 47 90 48 C86 43 74 43 70 48 C64 47 56 50 50 58 Z" fill="#1E1815"/>
    <!-- strong brows -->
    <rect x="62" y="56" width="13" height="3.4" rx="1.7" fill="#1E1815"/>
    <rect x="85" y="56" width="13" height="3.4" rx="1.7" fill="#1E1815"/>
    <!-- eyes -->
    <circle cx="69" cy="64" r="3.4" fill="#1E1815"/>
    <circle cx="91" cy="64" r="3.4" fill="#1E1815"/>
    <!-- confident smile -->
    <path d="M70 77 C76 83 84 83 90 77" fill="none" stroke="#B5764F" stroke-width="2.6" stroke-linecap="round"/>
    <!-- light stubble -->
    <path d="M56 70 C58 86 68 96 80 96 C92 96 102 86 104 70 C100 82 92 88 80 88 C68 88 60 82 56 70 Z" fill="#1E1815" opacity=".35"/>
  </g>
</svg>
